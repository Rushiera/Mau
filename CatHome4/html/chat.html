<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CH4 Cat 对话</title>
    <link rel="stylesheet" href="css/chat.css?v=__V__">
</head>
<body>
    <div id="chatbar">
        <span class="sid">CH4 Cat</span>
        <span id="chatInfo">—</span>
        <span style="flex:1"></span>
        <span id="uiVer" title="前端版本（刷新后变化=拿到新版）">UI v8</span>
        <button id="chatNew" title="新会话（session.new——清前文并重新注入）">新会话</button>
        <button id="chatRefresh" title="刷新——重建界面气泡（纯前端）">刷新</button>
    </div>
    <div id="chatStatus"></div>
    <div id="chatMsgs"></div>
    <!-- M4c Note 面板——Agent 与人交互的工作进度面板 -->
    <div id="notePanel" class="collapsed">
        <div id="noteHead">
            <span id="noteTitle">Note</span>
            <span id="noteToggleBtn">▸</span>
        </div>
        <div id="noteBody">
            <div id="noteList"></div>
            <div id="noteAddRow">
                <input id="noteAddInput" placeholder="新增任务…（Enter 提交）">
                <button id="noteAddBtn">＋</button>
                <button id="noteStartBtn" title="把 Note 计划拼接进度推给 LLM 开始执行">开始 Note</button>
            </div>
        </div>
    </div>
    <!-- 单向数据流改造——插话队列显示区（纯展示；正常流堆叠，对话区自动上移） -->
    <div id="chatPendingPanel"></div>
    <div id="chatinput">
        <input id="chatSendInput" placeholder="说话…（Enter 发送，发送期禁用）">
        <button id="chatSendBtn">发送</button>
    </div>

    <!-- 前端版本标记——每次改动前端递增；刷新后数字变化 = 拿到新版（人眼 cache-busting） -->
    <div style="position:fixed;left:8px;bottom:34px;background:rgba(0,0,0,0.6);border:1px solid #2a2a2a;border-radius:4px;padding:2px 8px;color:#6a9955;font-size:11px;z-index:99">UI v8</div>

    <!-- F2.3 引导层——对话核心逻辑在外部模块（js/chat-core.js + js/chat-note.js——对话逻辑唯一真相源）；本页只承接引导：applyUiConfig/SSE/按钮绑定（防御式）/初始化 -->
    <script src="js/chat-core.js?v=__V__"></script>
    <script src="js/chat-note.js?v=__V__"></script>
    <script>
        // ui.* 字号配置→CSS 变量（P8.5d 接线——读配置覆盖 CSS 默认；读不到默认 14px；全局字号配置已移除——静态提档替代 2026-08-28）
        function applyUiConfig(items) {
            var chat = 14;
            for (var i = 0; i < (items || []).length; i++) {
                if (items[i].key === 'ui.chat_font_size') { var c = parseInt(items[i].value, 10); if (c > 0) { chat = c; } }
            }
            document.documentElement.style.setProperty('--chat-font-size', chat + 'px');
        }
        fetch('/api/v1/config')
            .then(function (r) { return r.json(); })
            .then(function (d) { applyUiConfig(d.items || []); })
            .catch(function () {});

        // [段2] SSE 事件流——view/note 两事件（相对路径——天然按端口路由；F4 view 协议收敛唯一入口）
        var es = new EventSource('/api/v1/stream');
        es.addEventListener('view', function (ev) { chatOnView(JSON.parse(ev.data)); });
        es.addEventListener('note', function (ev) { noteOnEvent(JSON.parse(ev.data)); });   // M4c——Note 状态实时重绘
        es.onerror = function () { chatInfo.textContent = 'SSE 断线——自动重连...'; };
        es.onopen = function () {
            // 重连成功兜底——无条件重拉历史（CHAT_SESSION 动态更新 + 历史重绘；sending 态额外清容器）
            if (chatState === 'sending') {
                viewContainers = {};
                if (chatTimer) { clearTimeout(chatTimer); chatTimer = null; }
            }
            chatLoadHistory();
        };

        // [段3] 按钮绑定（防御式——元素缺失跳过；F2.3 从内联 onclick 迁出）
        var elChatNew = document.getElementById('chatNew');
        if (elChatNew) { elChatNew.addEventListener('click', chatNewSession); }
        var elChatRefresh = document.getElementById('chatRefresh');
        if (elChatRefresh) { elChatRefresh.addEventListener('click', chatRefresh); }
        var elChatSendBtn = document.getElementById('chatSendBtn');
        if (elChatSendBtn) { elChatSendBtn.addEventListener('click', chatSend); }
        var elChatSendInput = document.getElementById('chatSendInput');
        if (elChatSendInput) {
            elChatSendInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { chatSend(); }
            });
        }
        var elNoteHead = document.getElementById('noteHead');
        if (elNoteHead) { elNoteHead.addEventListener('click', noteToggle); }
        var elNoteAddBtn = document.getElementById('noteAddBtn');
        if (elNoteAddBtn) { elNoteAddBtn.addEventListener('click', noteAdd); }
        var elNoteAddInput = document.getElementById('noteAddInput');
        if (elNoteAddInput) {
            elNoteAddInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { noteAdd(); }
            });
        }
        var elNoteStartBtn = document.getElementById('noteStartBtn');
        if (elNoteStartBtn) { elNoteStartBtn.addEventListener('click', noteStart); }

        // [段4] 初始化——历史加载 + Note 兜底拉取
        chatLoadHistory();
        fetch('/api/v1/note').then(function (r) { return r.json(); }).then(function (j) { noteState = j; noteRender(); }).catch(function () {});
    </script>
</body>
</html>
