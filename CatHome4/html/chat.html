<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Cat Chat</title>
    <link rel="icon" href="/favicon.ico?v=__V__">
    <link rel="stylesheet" href="css/tokens.css?v=__V__">
    <link rel="stylesheet" href="css/chat.css?v=__V__">
</head>
<body>
    <div id="chatbar">
        <span class="sid" id="chatTitle">—</span>
        <span id="chatInfo">—</span>
        <span style="flex:1"></span>
        <span id="uiVer" data-version title="前端版本——每次 Vitest 自动递增 + 最后更新时间">UI v?</span>
        <button id="chatNew" title="新会话（session.new——清前文并重新注入）">新会话</button>
        <button id="chatRefresh" title="刷新——重建界面气泡（纯前端）">刷新</button>
        <button id="chatCacheClear" title="清理素材缓存——下次刷新重新下载桌宠素材（改图不改名 / 缓存脏数据时用）">清理缓存</button>
    </div>
    <div id="chatMsgs"></div>
    <!-- 自绘滚动带（design-ch4-frontend-scroll）——IDE 风格滚动带：视口指示块 + 消息刻度 + 点击跳转 + 拖拽；
         原生滚动条已隐藏（js/chat-scroll.js §二 为滚动执行器的呈现层）；几何由 JS 按对话区矩形同步 -->
    <div id="chatScrollBand"><div id="sbThumb"></div><div id="sbTicks"></div></div>

    <!-- 单向数据流改造——插话队列显示区（纯展示；正常流堆叠，对话区自动上移） -->
    <div id="chatPendingPanel"></div>
    <div id="chatinput">
        <!-- Note / 定时 / 跳底 按钮行（A121）——绝对定位贴输入区上缘（不占布局：按钮行与 popover 均不影响聊天区高度）；
             位置随 #chatinput 高度自动让位——ui.font_scale / 输入行数 / 待发图片行 / 插话队列变化均不再遮挡输入区 -->
        <div id="noteWrap" class="note-wrap">
            <div id="notePopover" class="note-popover" style="display:none">
                <div class="note-popover-head"><span id="noteTitle">Note</span></div>
                <div id="noteList"></div>
                <div id="noteAddRow">
                    <input id="noteAddInput" placeholder="新增任务…（Enter 提交）">
                    <button id="noteAddBtn">＋</button>
                    <button id="noteStartBtn" title="把 Note 计划拼接进度推给 LLM 开始执行">开始 Note</button>
                </div>
            </div>
            <div id="noteBubble" class="note-bubble" title="Note 工作进度——点击展开/收起">
                <span id="noteBubbleText">Note · 空</span>
            </div>
            <!-- 延迟指令队列（design-ch4-delay §六）——定时按钮 + 弹层（列表/倒计时/改时刻/取消/新建） -->
            <div id="delayWrap" class="delay-wrap">
                <button id="delayBtn" title="定时指令队列——延迟注入 / 改时刻 / 取消">定时<span id="delayCount"></span></button>
                <div id="delayPopover" class="delay-popover" style="display:none">
                    <div class="delay-popover-head"><span id="delayTitle">定时指令队列</span></div>
                    <div class="delay-sec delay-sec-list">
                        <div class="delay-sec-head">待触发<span id="delaySecCount"></span></div>
                        <div id="delayList"></div>
                    </div>
                    <div class="delay-sec delay-sec-add">
                        <div class="delay-sec-head">插入指令</div>
                        <div id="delayQuickRow"></div>
                        <div id="delayCustomRow" style="display:none">
                            <input type="datetime-local" id="delayCustomAt" step="1">
                        </div>
                        <div id="delayAddRow">
                            <input id="delayText" placeholder="注入内容…（Enter 提交）">
                            <label id="delayLoopLabel" title="循环——每次触发后按相同时长重排（不自动移除）"><input type="checkbox" id="delayLoop">循环</label>
                            <button id="delayAddBtn" title="按选中档位新建（或 Enter 提交）">＋</button>
                        </div>
                    </div>
                </div>
            </div>
            <button id="chatJumpBottom" title="跳到最下层（回到最新内容）">↓</button>
        </div>
        <div id="chatImages" class="chat-images"></div>
        <textarea id="chatSendInput" rows="5" placeholder="输入文本…（Enter 发送；Shift+Enter 换行；可直接粘贴图片）"></textarea>
        <!-- 输入区动作列（2026-09-30）——停止/继续/发送竖排同列、同款实心（底色区分语义）；原「停止」在顶部栏 -->
        <div id="chatActions">
            <button id="chatPause" class="ch-iabtn ch-iabtn-stop" title="停止本轮（cat.pause——已生成内容保留，前文格式修复）" disabled>停止</button>
            <button id="chatContinue" class="ch-iabtn ch-iabtn-continue" title="继续——用当前前文直接发一次 LLM 请求（cat.continue：不追加消息，模型续写）" disabled>继续</button>
            <button id="chatSendBtn" class="ch-iabtn ch-iabtn-send">发送</button>
        </div>
    </div>
    <!-- E 系列——状态区（四态计时 + Token 统计）：最底部持久存在 -->
    <div id="chatStatus"></div>
    <!-- 桌宠（纯前端渲染）——fixed 浮动层不占布局；纯展示（pointer-events:none，不拦对话区操作） -->
    <div id="chatPet"><img id="chatPetImgA" alt="桌宠"><img id="chatPetImgB" alt=""></div>

    <!-- F2.3 引导层——对话核心逻辑在外部模块（js/chat-md.js 渲染器 + js/chat-view.js 渲染面 + js/chat-core.js 状态分发 + js/chat-note.js——对话逻辑唯一真相源）；本页只承接引导：SSE/按钮绑定（防御式）/初始化 -->
    <!-- 两页共用前端工具（loadUiVersion/applyUiConfig/loadUiConfig）——js/ui-common.js 单一定义（消除内联副本） -->
    <script src="js/ui-common.js?v=__V__"></script>
    <!-- F3 MD 渲染——chat-md.js 手写解析器（纯函数，无依赖），必须先于 chat-view/chat-core 加载（chatOnText 调用 mdToHtml） -->
    <script src="js/chat-md.js?v=__V__"></script>
    <!-- 命令解读——chat-cmd.js 纯函数模块（powershell 工具卡可见性适配），必须先于 chat-view.js 加载（chatToolCard 调用 cmdDecodeTool） -->
    <script src="js/chat-cmd.js?v=__V__"></script>
    <!-- 工具块渲染——chat-tools.js 骨架层（语义大类）+ 逐工具填充单例（规格 design-ch4-frontend-tools）；必须先于 chat-view.js 加载（chatToolCard 调用 chatToolBody） -->
    <script src="js/chat-tools.js?v=__V__"></script>
    <!-- A85 Think 块两态渲染（流式态 live-only / 完成态落盘）——须先于 chat-view.js 与 chat-core.js -->
    <script src="js/chat-think.js?v=__V__"></script>
    <script src="js/chat-view.js?v=__V__"></script>
    <script src="js/chat-core.js?v=__V__"></script>
    <!-- 对话区滚动自持层（design-ch4-frontend-scroll）——滚轮兜底转发 + 自绘滚动带；须在 chat-core.js 之后加载（#chatMsgs 已就位） -->
    <script src="js/chat-scroll.js?v=__V__"></script>
    <script src="js/chat-note.js?v=__V__"></script>
    <!-- 延迟指令队列——列表/倒计时/新建/改时刻/取消（design-ch4-delay §六） -->
    <script src="js/chat-delay.js?v=__V__"></script>
    <!-- 桌宠素材清单（WorkSpace/pet/convert_pet.py 生成——缓存失效键；须先于 chat-pet.js） -->
    <script src="js/pet-manifest.js?v=__V__"></script>
    <!-- 桌宠——纯前端渲染（js/chat-pet.js）：读运行态与停留计时调整形态；须在 chat-core.js 之后加载 -->
    <script src="js/chat-pet.js?v=__V__"></script>
    <script>
        loadUiVersion();
        loadUiConfig();

        // [段2] SSE 事件流——view/note 两事件（相对路径——天然按端口路由；F4 view 协议收敛唯一入口）
        // A141——按订阅推送：本页只订阅四类，不订阅 log（日志帧不进本连接队列）
        var es = new EventSource('/api/v1/stream?topics=view,sessionstate,note,cmd');
        // A140——每类事件先过落差检测（SSE id 跳号 = 事件未达；出声 + 防抖补拉）
        es.addEventListener('view', function (ev) { chatSseSeq(ev); chatOnView(JSON.parse(ev.data)); });
        es.addEventListener('note', function (ev) { chatSseSeq(ev); noteOnEvent(JSON.parse(ev.data)); });   // M4c——Note 状态实时重绘
        // A59——运行态：本猫运行态（sessionstate）变化时推送 → 状态条；空闲期零推送（前端零轮询、零自算计时）
        es.addEventListener('sessionstate', function (ev) { chatSseSeq(ev); chatOnSessionState(JSON.parse(ev.data)); });
        es.onerror = function () { chatInfo.textContent = 'SSE 断线——自动重连...'; chatPetSetOffline(true); };
        es.onopen = function () {
            // A142——重连分流：有续传基线走增量 append（不重建）；无基线（首连 / 会话切换）走全量分片重建。
            // 旧行为「无条件全量重拉」已退役——长会话全量重建是卡顿主因（秒级长任务 → 页面无响应）。
            // A140——落差基线重置：新连接 id 序列从头开始，旧基线不适用
            sseSeqReset();
            chatPetSetOffline(false);
            if (chatState === 'sending') {
                viewContainers = {};
                if (chatTimer) { clearTimeout(chatTimer); chatTimer = null; }
            }
            chatReconnectResume();
        };

        // [段3] 按钮绑定（防御式——元素缺失跳过；F2.3 从内联 onclick 迁出）
        var elChatNew = document.getElementById('chatNew');
        if (elChatNew) { elChatNew.addEventListener('click', chatNewSession); }
        var elChatRefresh = document.getElementById('chatRefresh');
        if (elChatRefresh) { elChatRefresh.addEventListener('click', chatRefresh); }
        var elChatPause = document.getElementById('chatPause');
        if (elChatPause) { elChatPause.addEventListener('click', chatPause); }
        var elChatContinue = document.getElementById('chatContinue');
        if (elChatContinue) { elChatContinue.addEventListener('click', chatContinue); }
        var elChatSendBtn = document.getElementById('chatSendBtn');
        if (elChatSendBtn) { elChatSendBtn.addEventListener('click', chatSend); }
        var elChatSendInput = document.getElementById('chatSendInput');
        if (elChatSendInput) {
            // 多排输入——Enter 发送（preventDefault 阻止 textarea 插入换行）；Shift+Enter 走默认换行
            elChatSendInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatSend(); }
            });
            // A65 图片粘贴——仅图片项被拦截（上传进缓存区），纯文本粘贴原样入框
            elChatSendInput.addEventListener('paste', chatOnPaste);
        }
        var elNoteBubble = document.getElementById('noteBubble');
        if (elNoteBubble) { elNoteBubble.addEventListener('click', function (e) { e.stopPropagation(); noteToggle(); }); }
        // 跳底按钮——回到最新内容（无条件滚到底；2026-09-17）
        var elJumpBottom = document.getElementById('chatJumpBottom');
        if (elJumpBottom) { elJumpBottom.addEventListener('click', chatJumpBottom); }
        var elNoteAddBtn = document.getElementById('noteAddBtn');
        if (elNoteAddBtn) { elNoteAddBtn.addEventListener('click', noteAdd); }
        var elNoteAddInput = document.getElementById('noteAddInput');
        if (elNoteAddInput) {
            elNoteAddInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { noteAdd(); }
            });
        }
        var elNoteStartBtn = document.getElementById('noteStartBtn');
        if (elNoteStartBtn) { elNoteStartBtn.addEventListener('click', noteStart); }
        // Q6 页面标题——快照 title 字段（displayName · Chat；SSE snapshot 事件实时应用 + 初始化兜底 fetch；前端零业务逻辑）
        function chatApplyTitle(t) {
            if (!t) { return; }
            document.title = t;
            var st = document.getElementById('chatTitle');
            if (st) { st.textContent = t; }
        }
        es.addEventListener('snapshot', function (ev) {
            chatSseSeq(ev);
            try { chatApplyTitle(JSON.parse(ev.data).title); } catch (e) { uiWarn('标题快照解析', e); }
        });
        fetch('/api/v1/snapshot').then(function (r) { return r.json(); }).then(function (snap) {
            chatApplyTitle(snap.title);
        }).catch(function (e) { uiWarn('标题快照', e); });

        // [段4] 初始化——历史加载 + Note 兜底拉取（版本填充已在引导头部完成）
        chatLoadHistory();
        chatPetInit();
        delayInit();
        fetch('/api/v1/note').then(function (r) { return r.json(); }).then(function (j) { noteState = j; noteRender(); }).catch(function (e) { uiWarn('Note 兜底拉取', e); });
    </script>
</body>
</html>
