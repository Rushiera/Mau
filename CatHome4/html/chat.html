<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Cat Chat</title>
    <link rel="icon" href="/favicon.ico?v=__V__">
    <link rel="stylesheet" href="css/tokens.css?v=__V__">
    <link rel="stylesheet" href="css/chat.css?v=__V__">
</head>
<body>
    <!-- ═══ 顶部栏 ═══ -->
    <div id="chatbar">
        <span class="sid" id="chatTitle">—</span>
        <span id="chatInfo">—</span>
        <span style="flex:1"></span>
        <span id="uiVer" data-version title="前端版本——每次 Vitest 自动递增 + 最后更新时间">UI v?</span>
        <button id="chatNew" title="新会话（session.new——清前文并重新注入）">新会话</button>
        <button id="chatRefresh" title="刷新——重建界面气泡（纯前端）">刷新</button>
        <button id="chatCacheClear" title="清理素材缓存——下次刷新重新下载桌宠素材（改图不改名 / 缓存脏数据时用）">清理缓存</button>
    </div>

    <!-- ═══ 持久区——对话区（契约 §12.2 ②：每块对应一个气泡渲染函数） ═══ -->
    <div id="chatMsgs"></div>
    <!-- 自绘滚动带（js/chat/fx/scroll.js · design-ch4-frontend-scroll）——IDE 风格滚动带：视口指示块 + 消息刻度 + 点击跳转 + 拖拽；
         原生滚动条已隐藏；几何由 JS 按对话区矩形同步 -->
    <div id="chatScrollBand"><div id="sbThumb"></div><div id="sbTicks"></div></div>

    <!-- ═══ 插话队列显示区（js/chat/fx/pending.js——本地入列 / user 块到达出列；纯展示，空表自动隐藏） ═══ -->
    <div id="chatPendingPanel"></div>

    <!-- ═══ 输入区 ═══ -->
    <div id="chatinput">
        <!-- 临时区（契约 §12.2 ③ / §6.1-F）——与持久区物理分离：输入区左侧切换面板（全量镜像替换）；
             隐藏时即流式显示态；回车发送时主干自动切回本态 -->
        <div id="chatLivePanel" class="chat-live" style="display:none"></div>

        <!-- Note / 定时 / 跳底 按钮行（绝对定位贴输入区上缘；Note 面板 note.js · 定时面板 delay.js · 跳底在 main.js） -->
        <div id="noteWrap" class="note-wrap">
            <div id="notePopover" class="note-popover" style="display:none">
                <div class="note-popover-head"><span id="noteTitle">Note</span></div>
                <div id="noteList"></div>
                <div id="noteAddRow">
                    <input id="noteAddInput" placeholder="新增任务…（Enter 提交）">
                    <button id="noteAddBtn">＋</button>
                    <button id="noteStartBtn" title="把 Note 计划拼接进度推给 LLM 开始执行">开始 Note</button>
                </div>
            </div>
            <div id="noteBubble" class="note-bubble" title="Note 工作进度——点击展开/收起">
                <span id="noteBubbleText">Note · 空</span>
            </div>
            <!-- 延迟指令队列（design-ch4-delay §六）——定时按钮 + 弹层（delay.js） -->
            <div id="delayWrap" class="delay-wrap">
                <button id="delayBtn" title="定时指令队列——延迟注入 / 改时刻 / 取消">定时<span id="delayCount"></span></button>
                <div id="delayPopover" class="delay-popover" style="display:none">
                    <div class="delay-popover-head"><span id="delayTitle">定时指令队列</span></div>
                    <div class="delay-sec delay-sec-list">
                        <div class="delay-sec-head">待触发<span id="delaySecCount"></span></div>
                        <div id="delayList"></div>
                    </div>
                    <div class="delay-sec delay-sec-add">
                        <div class="delay-sec-head">插入指令</div>
                        <div id="delayQuickRow"></div>
                        <div id="delayCustomRow" style="display:none">
                            <input type="datetime-local" id="delayCustomAt" step="1">
                        </div>
                        <div id="delayAddRow">
                            <input id="delayText" placeholder="注入内容…（Enter 提交）">
                            <label id="delayLoopLabel" title="循环——每次触发后按相同时长重排（不自动移除）"><input type="checkbox" id="delayLoop">循环</label>
                            <button id="delayAddBtn" title="按选中档位新建（或 Enter 提交）">＋</button>
                        </div>
                    </div>
                </div>
            </div>
            <button id="chatJumpBottom" title="跳到最下层（回到最新内容）">↓</button>
        </div>

        <div id="chatImages" class="chat-images"></div>
        <textarea id="chatSendInput" rows="5" placeholder="输入文本…（Enter 发送；Shift+Enter 换行；可直接粘贴图片）"></textarea>
        <!-- 输入区动作列——临时区切换 / 停止 / 继续 / 发送（竖排同列、同款实心；底色区分语义） -->
        <div id="chatActions">
            <button id="chatLiveToggle" class="ch-iabtn ch-iabtn-live" title="查看进行中的临时内容（流式 / 工具卡）——再点回到对话流">临时</button>
            <button id="chatPause" class="ch-iabtn ch-iabtn-stop" title="停止本轮（cat.pause——已生成内容保留，前文格式修复）" disabled>停止</button>
            <button id="chatContinue" class="ch-iabtn ch-iabtn-continue" title="继续——用当前前文直接发一次 LLM 请求（cat.continue：不追加消息，模型续写）" disabled>继续</button>
            <button id="chatSendBtn" class="ch-iabtn ch-iabtn-send">发送</button>
        </div>
    </div>

    <!-- ═══ 状态区——六态计时（契约 §12.2 ① state 段投影） ═══ -->
    <div id="chatStatus"></div>
    <!-- 桌宠（纯前端渲染——js/chat/fx/pet.js；素材清单 js/pet-manifest.js） -->
    <div id="chatPet"><img id="chatPetImgA" alt="桌宠"><img id="chatPetImgB" alt=""></div>

    <!-- ═══════════════════════════════════════════
         脚本清单——加载顺序即依赖顺序：
           ① 公共件（两页共用）→ ② 素材 lib → ③ 素材 blocks → ④ 主干 → ⑤ 面板 / 侧翼 → ⑥ 独立功能 fx
         素材与主干的边界：素材零全局状态（返回元素即完）；挂载 / 排序 / 跟随 / 指令归主干。
         函数声明在脚本加载时即注册全局，故跨件引用按运行时解析——
         硬顺序两处：③ 先于 ④（registry.js 顶层把 blocks 的函数引用收进映射表）；
                     ⑥ 段末 registry.js 在其各件之后（fx 表持有入口名），fxBoot 由引导层调用。
         ═══════════════════════════════════════════ -->
    <script src="js/ui-common.js?v=__V__"></script>
    <!-- 桌宠素材清单（生成物——`WorkSpace/pet/convert_pet.py` 产出；A171 桌宠渲染用） -->
    <script src="js/pet-manifest.js?v=__V__"></script>

    <!-- ② 素材 lib——块渲染共用件（DOM 构造 / 格式化 / MD / 图片 / 按压判据 / 思考头行 / 工具骨架） -->
    <script src="js/chat/lib/dom.js?v=__V__"></script>
    <script src="js/chat/lib/format.js?v=__V__"></script>
    <script src="js/chat/lib/press.js?v=__V__"></script>
    <script src="js/chat/lib/md.js?v=__V__"></script>
    <script src="js/chat/lib/md-copy.js?v=__V__"></script>
    <script src="js/chat/lib/images.js?v=__V__"></script>
    <script src="js/chat/lib/think-head.js?v=__V__"></script>
    <script src="js/chat/lib/tool-format.js?v=__V__"></script>
    <script src="js/chat/lib/fallback.js?v=__V__"></script>
    <script src="js/chat/lib/cmd.js?v=__V__"></script>

    <!-- ③ 素材 blocks——契约 11 类块型各一件（persist 8 + live 3） -->
    <script src="js/chat/blocks/user.js?v=__V__"></script>
    <script src="js/chat/blocks/text.js?v=__V__"></script>
    <script src="js/chat/blocks/reason.js?v=__V__"></script>
    <script src="js/chat/blocks/toolcard.js?v=__V__"></script>
    <script src="js/chat/blocks/retry.js?v=__V__"></script>
    <script src="js/chat/blocks/error.js?v=__V__"></script>
    <script src="js/chat/blocks/inject-report.js?v=__V__"></script>
    <script src="js/chat/blocks/roundsum.js?v=__V__"></script>
    <script src="js/chat/blocks/stream-text.js?v=__V__"></script>
    <script src="js/chat/blocks/stream-reason.js?v=__V__"></script>
    <script src="js/chat/blocks/stream-toolcard.js?v=__V__"></script>

    <!-- ④ 主干——映射表 → 两区入口 → 状态投影 → 单一应用入口 -->
    <script src="js/chat/registry.js?v=__V__"></script>
    <script src="js/chat/persist.js?v=__V__"></script>
    <script src="js/chat/live.js?v=__V__"></script>
    <script src="js/chat/state.js?v=__V__"></script>
    <script src="js/chat/main.js?v=__V__"></script>
    <script src="js/chat/input.js?v=__V__"></script>

    <!-- ⑤ 面板与侧翼（主干层）——note / delay 面板 · paste 出口面 -->
    <script src="js/chat/note.js?v=__V__"></script>
    <script src="js/chat/delay.js?v=__V__"></script>
    <script src="js/chat/paste.js?v=__V__"></script>

    <!-- ⑥ 独立功能（fx）——每功能一件 · registry.js 在段末（表持有各件入口名）；启动由引导层 fxBoot() 统一执行 -->
    <script src="js/chat/fx/pet.js?v=__V__"></script>
    <script src="js/chat/fx/scroll.js?v=__V__"></script>
    <script src="js/chat/fx/pending.js?v=__V__"></script>
    <script src="js/chat/fx/cmd-intent.js?v=__V__"></script>
    <script src="js/chat/fx/controls.js?v=__V__"></script>
    <script src="js/chat/fx/registry.js?v=__V__"></script>

    <script>
        // 引导层——只做接线与启动，不含业务逻辑
        loadUiVersion();
        loadUiConfig();
        chatBoot();
        fxBoot();
    </script>
</body>
</html>
